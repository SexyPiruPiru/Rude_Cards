name: rude_cards
description: Omaggio a Cruel Cards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  share_plus: 13.3.1
  file_picker: ^13.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards_it.json

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true