workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Installa dipendenze CocoaPods
        script: |
          cd ios
          pod install
      - name: Compila iOS (Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Comprimi l'app in ZIP per il download
        script: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
    artifacts:
      - build/ios/iphoneos/Runner.app.zip