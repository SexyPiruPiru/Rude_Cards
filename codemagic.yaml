workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pulisci e scarica dipendenze Flutter
        script: |
          flutter clean
          flutter pub get
      - name: Installa dipendenze CocoaPods (iOS)
        script: |
          cd ios
          pod repo update
          pod install
      - name: Compila app iOS (Release)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
        - build/ios/ipa/*.ipa